<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大專資源教室 - 學習輔具線上清單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>[v-cloak] { display: none !important; }</style>
</head>
<body class="bg-[#F9F6F0] text-gray-800 font-sans m-0 p-0">

    <div id="app" v-cloak class="min-h-screen flex flex-col">
        <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="text-center sm:text-left">
                    <h1 class="text-xl font-bold tracking-widest text-[#2C4A3E] uppercase">Resource Classroom Learning Aid Resource Network</h1>
                    <p class="text-xs text-gray-400 tracking-wider mt-0.5">資源教室學習輔具資源網</p>
                </div>
                <div class="w-full sm:w-72">
                    <input type="text" v-model="searchQuery" placeholder="搜尋輔具名稱..." 
                           class="w-full px-4 py-2 rounded-full bg-gray-100 text-sm border-0 focus:ring-2 focus:ring-[#2C4A3E] focus:bg-white">
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
            <div v-if="loading" class="text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-300 border-t-[#2C4A3E] mb-4"></div>
                <p class="text-sm text-gray-500">正在同步雲端庫存...</p>
            </div>

            <div v-else class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div v-for="item in filteredEquipments" :key="item.name" 
                     class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between p-5">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-mono">編號: {{ item.id }}</span>
                            <span :class="item.remaining <= 0 ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700'" class="text-[10px] px-2.5 py-1 rounded-full font-bold">
                                剩餘 {{ item.remaining }} 台 / 總共 {{ item.total }} 台
                            </span>
                        </div>
                        <h3 class="text-base font-bold text-gray-900 mb-2">{{ item.name }}</h3>
                        <p class="text-xs text-gray-500 line-clamp-3 mb-4">{{ item.desc }}</p>
                    </div>
                    <div class="pt-4 border-t border-gray-100 flex justify-between items-center">
                        <span class="text-xs text-gray-400">位置: {{ item.location }}</span>
                        <a :hover="item.remaining <= 0" :href="item.form" target="_blank" 
                           class="bg-[#2C4A3E] text-white text-xs px-4 py-2 rounded-xl font-medium hover:bg-[#1E332B] transition-colors">
                            線上預約
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const spreadsheetId = '1BXALU_DAFpErYY1FaEc9_at7DSOuS9HssbZ2B36LIig';
                const listUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tq=select%20*&sheet=%E8%BC%94%E5%85%B7%E6%B8%85%E5%96%AE`;
                const formUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tq=select%20*&sheet=%E8%A1%A8%E5%96%AE%E5%9B%9E%E6%87%89%201`;

                const equipments = ref([]);
                const loading = ref(true);
                const searchQuery = ref('');

                const loadData = async () => {
                    try {
                        // 1. 抓取表單回應並精準計算被借了幾次
                        let rentCounts = {};
                        try {
                            const resForm = await fetch(formUrl);
                            const textForm = await resForm.text();
                            const jsonForm = JSON.parse(textForm.substring(textForm.indexOf('{'), textForm.lastIndexOf('}') + 1));
                            
                            if (jsonForm.table && jsonForm.table.rows) {
                                jsonForm.table.rows.forEach(row => {
                                    if (!row || !row.c) return;
                                    row.c.forEach(cell => {
                                        if (cell && cell.v) {
                                            const val = String(cell.v).trim();
                                            if (val) {
                                                rentCounts[val] = (rentCounts[val] || 0) + 1;
                                            }
                                        }
                                    });
                                });
                            }
                        } catch (e) { console.log("暫無回應資料", e); }

                        // 2. 抓取輔具清單主表
                        const resList = await fetch(listUrl);
                        const textList = await resList.text();
                        const jsonList = JSON.parse(textList.substring(textList.indexOf('{'), textList.lastIndexOf('}') + 1));
                        
                        const rows = jsonList.table.rows;
                        const cols = jsonList.table.cols;

                        equipments.value = rows.map(row => {
                            let item = {};
                            row.c.forEach((cell, i) => {
                                const label = cols[i] && cols[i].label ? cols[i].label.trim() : `col_${i}`;
                                item[label] = cell && cell.v !== null ? String(cell.v).trim() : '';
                            });

                            // 精準抓取欄位
                            const name = item['輔具名稱'] || '';
                            let total = 8; // 如果抓不到數量，預設總數是 8
                            
                            // 尋找試算表裡有沒有寫著「數量」的欄位
                            Object.keys(item).forEach(key => {
                                if (key.includes('數量')) {
                                    const parsed = parseInt(item[key]);
                                    if (!isNaN(parsed)) total = parsed;
                                }
                            });

                            // 精準計算剩餘：總數減掉被借用次數
                            const rented = rentCounts[name] || 0;
                            const remaining = Math.max(0, total - rented);

                            return {
                                id: item['輔具編號'] || item['編號'] || 'VT',
                                name: name,
                                desc: item['功能簡介'] || '暫無描述。',
                                location: item['保管位置'] || '資源教室',
                                form: 'https://forms.google.com', // 預設表單連結
                                total: total,
                                remaining: remaining
                            };
                        }).filter(e => e.name !== '');

                    } catch (error) {
                        console.error("資料加載失敗", error);
                    } finally {
                        loading.value = false;
                    }
                };

                const filteredEquipments = computed(() => {
                    if (!searchQuery.value) return equipments.value;
                    return equipments.value.filter(e => e.name.toLowerCase().includes(searchQuery.value.toLowerCase()));
                });

                onMounted(loadData);
                return { equipments, filteredEquipments, loading, searchQuery };
            }
        }).mount('#app');
    </script>
</body>
</html>
